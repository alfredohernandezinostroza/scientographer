[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "scientographer"
# The version lives in one place, scientographer/__init__.py (see RELEASING.md).
dynamic = ["version"]
description = "Map a scientific literature from its citation network: Leiden/CPM communities across a resolution sweep, quality and well-connectedness metrics, keyword labels and an interactive map, as a reproducible Hamilton + DVC pipeline."
readme = "README.md"
authors = [{ name = "Alfredo Hernández Inostroza" }]
requires-python = ">=3.10"
# The pipeline is AGPL-3.0-or-later; the map frontend and the project templates that
# are copied into users' sites and projects are MIT (see LICENSE-MIT). The bundled
# example's data: the articles' own CC BY licenses and OpenAlex's CC0 (see LICENSES/).
license = "AGPL-3.0-or-later AND MIT AND CC0-1.0 AND LicenseRef-CC-BY-per-article"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSES/*.txt"]
keywords = ["citation network", "bibliometrics", "science mapping", "community detection", "leiden", "scientometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "sf-hamilton[sdk]>=1.89,<2",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "cdlib>=0.4",
    "networkx>=3",
    "pandas>=2.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "python-dotenv>=1",
    "typer>=0.12",
    "matplotlib>=3.8",
    # ForceAtlas2 layout (compiles a C speed-up when it can, else runs as pure Python),
    # the word-cloud stage, and DVC with S3-compatible remotes (DagsHub, AWS S3, MinIO;
    # other storage needs its plugin, e.g. `pip install dvc-gdrive`).
    "fa2>=1.1",
    "wordcloud>=1.9",
    "shapely>=2",
    "pillow>=10",
    "dvc>=3.50",
    "dvc-s3>=3",
    # Drawing each stage's DAG to reports/figures/ (also needs the Graphviz `dot`
    # program; without it the drawings are skipped).
    "graphviz>=0.20",
]

[project.optional-dependencies]
# The base install runs every stage of a project made by `scientographer init`; the
# extras add the heavy parts few projects need.
# Text embeddings and their maps (embed_papers, embedding_maps): Gemini's API and/or
# SPECTER2 run locally (PyTorch), BERTopic topics and UMAP layouts.
embeddings = ["google-genai>=1", "torch>=2", "transformers>=4.40", "adapters>=1", "bertopic>=0.16", "umap-learn>=0.5", "hdbscan>=0.8"]
# The Hamilton UI tracker (`scientographer ui`).
ui = ["sf-hamilton[ui]>=1.89,<2"]
all = ["scientographer[embeddings,ui]"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/alfredohernandezinostroza/scientographer"
Documentation = "https://github.com/alfredohernandezinostroza/scientographer#readme"
Source = "https://github.com/alfredohernandezinostroza/scientographer"
Issues = "https://github.com/alfredohernandezinostroza/scientographer/issues"
Changelog = "https://github.com/alfredohernandezinostroza/scientographer/blob/main/CHANGELOG.md"

[project.scripts]
scientographer = "scientographer.cli:app"

[tool.flit.sdist]
# The source archive also carries what a contributor or packager needs.
include = ["CHANGELOG.md", "RELEASING.md", "CITATION.cff", "CONTRIBUTING.md", "CLA.md", "REUSE.toml", "LICENSES/", "skills/"]

[tool.ruff]
line-length = 110
src = ["scientographer"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["scientographer"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["scientographer/tests"]
