# The stages `scientographer init --pubmed` puts in front of the pipeline (and of
# fetch_references): a PubMed search becomes data/papers.parquet.
  search_pubmed:
    cmd: scientographer run search_pubmed
    params:
      - pubmed_search
    outs:
      # Downloaded records are kept between runs: a wider query fetches only new ones.
      - ${pubmed_search.output_dir}:
          persist: true

  ingest:
    cmd: scientographer run ingest
    deps:
      - ${pubmed_search.output_dir}
    params:
      - ingest
    outs:
      - ${citation_network.papers_table}
      - ${ingest.report_dir}
