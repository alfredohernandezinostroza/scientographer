# The stages `scientographer init --pubmed` puts in front of the pipeline: a PubMed
# search becomes data/papers.parquet and data/references.parquet.
  search_pubmed:
    cmd: scientographer run search_pubmed
    params:
      - pubmed_search
    outs:
      # Downloaded records are kept between runs: a wider query fetches only new ones.
      - ${pubmed_search.output_dir}:
          persist: true

  ingest:
    cmd: scientographer run ingest
    deps:
      - ${pubmed_search.output_dir}
    params:
      - ingest
    outs:
      - ${citation_network.papers_table}
      - ${ingest.report_dir}

  fetch_references:
    cmd: scientographer run fetch_references
    deps:
      - ${citation_network.papers_table}
    params:
      - fetch_references
    outs:
      - ${citation_network.references_table}
      # Looked-up papers are kept between runs: re-runs ask OpenAlex only for new ones.
      - ${fetch_references.store_dir}:
          persist: true

