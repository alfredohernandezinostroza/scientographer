# The Scientographer pipeline for this project. Every stage runs one module of the
# installed package; its settings come from params.yaml (read through `vars`, so a
# changed path or value re-runs exactly the stages that use it).
#
#   dvc repro                     # run everything that is out of date
#   dvc repro build_website       # up to one stage
#   dvc dag                       # draw the stage graph
#   dvc exp run -S resolutions.canonical=0.003    # an experiment
#   dvc metrics show              # summary metrics at the canonical resolution
#
# Anything compared *within* one run (the resolution sweep) stays inside a stage;
# experiments vary the settings around it.

vars:
  - params.yaml

stages:
  citation_network:
    cmd: scientographer run build_citation_network
    deps:
      - ${citation_network.papers_table}
      - ${citation_network.references_table}
    params:
      - citation_network
    outs:
      - ${citation_network.output_graphml}

  detect_communities:
    cmd: scientographer run detect_communities
    deps:
      - ${detect_communities.input_graphml}
    params:
      - detect_communities
      - resolutions
    outs:
      - ${detect_communities.output_graphml}
      - ${detect_communities.summary_parquet}

  layout_graph:
    cmd: scientographer run layout_graph
    deps:
      - ${layout.input_graphml}
    params:
      - layout
    outs:
      - ${layout.output_graphml}

  community_quality_metrics:
    cmd: scientographer run community_quality_metrics
    deps:
      - ${graph.low_band_graphml}
    params:
      - graph
      - resolutions
      - communities
    outs:
      - ${graph.analysis_output_dir}/community_quality_metrics
      - ${graph.analysis_output_dir}/citation_network_with_community_metrics.graphml
    metrics:
      - ${graph.analysis_output_dir}/metrics/community_quality_metrics.json:
          cache: false
    plots:
      - ${graph.analysis_output_dir}/plots/community_quality_metrics_per_partition.csv:
          x: resolution
          y: modularity
          cache: false

  community_connectivity_metrics:
    cmd: scientographer run community_connectivity_metrics
    deps:
      - ${graph.low_band_graphml}
    params:
      - graph
      - resolutions
      - communities
    outs:
      - ${graph.analysis_output_dir}/community_connectivity_metrics
    metrics:
      - ${graph.analysis_output_dir}/metrics/community_connectivity_metrics.json:
          cache: false
    plots:
      - ${graph.analysis_output_dir}/plots/community_connectivity_metrics_per_partition.csv:
          x: resolution
          y: fraction_well_connected_over_substantive_communities
          cache: false

  community_connectivity_modifier:
    cmd: scientographer run community_connectivity_modifier
    deps:
      - ${graph.low_band_graphml}
    params:
      - graph
      - resolutions
      - communities
    outs:
      - ${graph.analysis_output_dir}/community_connectivity_modifier

  community_quality_metrics_after_connectivity_modifier:
    cmd: scientographer run community_quality_metrics_after_connectivity_modifier
    deps:
      - ${graph.low_band_graphml}
      - ${graph.analysis_output_dir}/community_connectivity_modifier
    params:
      - graph
      - resolutions
      - communities
    outs:
      - ${graph.analysis_output_dir}/community_quality_metrics_after_connectivity_modifier

  community_keywords:
    cmd: scientographer run community_keywords
    deps:
      - ${community_keywords.input_graphml}
    params:
      - community_keywords
      - graph.analysis_output_dir
    outs:
      - ${graph.analysis_output_dir}/community_keywords

  wordclouds:
    cmd: scientographer run wordclouds
    deps:
      - ${wordclouds.input_graphml}
    params:
      - wordclouds
    outs:
      - ${wordclouds.output_dir}

  build_website:
    cmd: scientographer run build_website
    deps:
      - ${website.graphml}
      - ${website.per_community_metrics}
      - ${website.per_partition_metrics}
      - ${website.after_cm_partition_metrics}
      - ${website.connectivity_diagnostic_partition}
      - ${website.connectivity_modifier_partition}
      - ${website.community_keyword_scores}
      - ${wordclouds.output_dir}
    params:
      - website
    outs:
      - ${website.output_dir}:
          cache: false
