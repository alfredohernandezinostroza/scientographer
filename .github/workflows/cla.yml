# Contributor License Agreement check (CLA.md). On every pull request, contributors
# who have not signed are asked to comment the sentence below; the check fails until
# they do. Signatures are stored in signatures/version1/cla.json on the
# `cla-signatures` branch, so main is never written to by the bot.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/alfredohernandezinostroza/scientographer/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "alfredohernandezinostroza,dependabot[bot],github-actions[bot]"
