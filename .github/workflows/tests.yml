name: tests

on:
  push:
  pull_request:
  workflow_call:   # the release workflow runs the tests first

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The plain install must run a whole project; the extras are tested below.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Example project end to end
        env:
          DVC_NO_ANALYTICS: "1"
        run: |
          scientographer example "$RUNNER_TEMP/example"
          cd "$RUNNER_TEMP/example"
          git init -q && dvc init -q
          dvc repro
          test -f reports/website/index.html
          test -f reports/website/network_data/communities_by_resolution.json

  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with every extra
        run: pip install -e ".[all,dev]"
      - name: Unit tests
        run: pytest -q
