# Publish to PyPI with Trusted Publishing (no API token stored anywhere).
#
# - Publishing a GitHub release tagged vX.Y.Z runs the tests, checks the release is
#   consistent (tools/check_release.py: version, tag, changelog, citation), builds the
#   sdist and wheel, and uploads them to PyPI. RELEASING.md has the steps.
# - Running this workflow by hand (Actions > release > Run workflow) uploads the
#   current main to TestPyPI as X.Y.Z.devN (N = the run number; an index never takes
#   the same version twice), to rehearse a release.
#
# One-time setup on pypi.org and test.pypi.org: Publishing > Add a pending publisher
# (owner alfredohernandezinostroza, repository scientographer, workflow release.yml,
# environment pypi / testpypi).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the release is consistent
        if: github.event_name == 'release'
        run: python tools/check_release.py "${GITHUB_REF_NAME}"
      - name: Give the rehearsal a version of its own
        if: github.event_name == 'workflow_dispatch'
        run: sed -i -E "s/^__version__ = \"([0-9.]+)(\.dev[0-9]+)?\"/__version__ = \"\1.dev${GITHUB_RUN_NUMBER}\"/" scientographer/__init__.py && grep __version__ scientographer/__init__.py
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scientographer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/scientographer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
